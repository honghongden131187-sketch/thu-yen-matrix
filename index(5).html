<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6a6bf">
<title>Nguyễn Thị Thu Yên ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5c1cf}
body{
  background-image:
    linear-gradient(rgba(255,190,215,.10),rgba(70,20,45,.18)),
    url("background.jpg");
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
.vignette{
  position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,.04),rgba(35,5,20,.10));
}
</style>
</head>
<body>
<canvas id="rain"></canvas><div class="vignette"></div>
<script>
const c=document.getElementById("rain"),ctx=c.getContext("2d");
const name="Nguyễn Thị Thu Yên", heart="❤";
let W,H,dpr,fs,spacing,cols,drops,speeds;

function setup(){
 dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 fs=W<600?17:21; spacing=W<600?190:235;
 cols=Math.ceil(W/spacing)+2;
 drops=Array.from({length:cols},()=>-Math.random()*H*1.4);
 speeds=Array.from({length:cols},()=>.18+Math.random()*.20);
}
function frame(){
 ctx.clearRect(0,0,W,H);
 ctx.font=`700 ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif`;
 ctx.textBaseline="top";
 for(let i=0;i<cols;i++){
   const x=i*spacing-35, y=drops[i];
   ctx.shadowBlur=10;ctx.shadowColor="rgba(255,40,130,.75)";
   ctx.fillStyle="rgba(255,92,164,.88)";
   ctx.fillText(name,x,y);
   const tw=ctx.measureText(name).width;
   ctx.shadowColor="rgba(255,0,45,.9)";
   ctx.fillStyle="#ff214f";ctx.fillText(heart,x+tw+7,y);
   drops[i]+=speeds[i];
   if(y>H+45){drops[i]=-60-Math.random()*H*.7;speeds[i]=.18+Math.random()*.20;}
 }
 ctx.shadowBlur=0;
 requestAnimationFrame(frame);
}
addEventListener("resize",setup);setup();frame();
</script>
</body></html>
