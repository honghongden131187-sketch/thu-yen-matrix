<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4a8c2">
<title>Nguyễn Thị Thu Yên ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5c1cf}
body{
  background-image:
    linear-gradient(rgba(255,205,225,.08),rgba(45,10,30,.13)),
    url("background.jpg");
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<script>
const c=document.getElementById("rain"),ctx=c.getContext("2d");
const name="Nguyễn Thị Thu Yên", heart="♥";
let W,H,dpr,fs,spacing,cols,drops,speeds,offsets;

function setup(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  c.width=W*dpr; c.height=H*dpr;
  c.style.width=W+"px"; c.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);

  fs=W<600?16:20;
  spacing=W<600?128:165;            // nhiều cột hơn
  cols=Math.ceil(W/spacing)+3;
  drops=Array.from({length:cols},()=>-Math.random()*H);
  speeds=Array.from({length:cols},()=>0.23+Math.random()*0.25);
  offsets=Array.from({length:cols},()=>Math.random()*110);
}

function drawPhrase(x,y,alpha=1){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.font=`italic 600 ${fs}px "Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery",cursive`;
  ctx.textBaseline="top";
  ctx.shadowBlur=9;
  ctx.shadowColor="rgba(255,45,135,.75)";
  ctx.fillStyle="#ff69ad";
  ctx.fillText(name,x,y);
  const tw=ctx.measureText(name).width;
  ctx.font=`700 ${fs+2}px Arial,sans-serif`;
  ctx.shadowColor="rgba(255,0,55,.9)";
  ctx.fillStyle="#ff214f";
  ctx.fillText(heart,x+tw+6,y-1);
  ctx.restore();
}

function frame(){
  ctx.clearRect(0,0,W,H);

  for(let i=0;i<cols;i++){
    const x=i*spacing-60;
    const y=drops[i];

    // 3 lớp chữ trong mỗi cột => màn hình dày chữ hơn nhưng vẫn thấy ảnh nền
    drawPhrase(x,y,.96);
    drawPhrase(x+18,y-155-offsets[i],.72);
    drawPhrase(x-8,y-310-offsets[i]*.45,.48);

    drops[i]+=speeds[i];
    if(y>H+360){
      drops[i]=-40-Math.random()*180;
      speeds[i]=0.23+Math.random()*0.25;
      offsets[i]=Math.random()*110;
    }
  }
  requestAnimationFrame(frame);
}
addEventListener("resize",setup);
setup(); frame();
</script>
</body>
</html>
